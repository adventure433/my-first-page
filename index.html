<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的第一个网页</title>
<style>
  :root { --bg:#dbeafe; --card:#fff; --text:#1e293b; --muted:#64748b; --accent:#2563eb; --tag:#eff6ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px;
    background: linear-gradient(-45deg, var(--bg), #e0f2fe, #c7d9fb, #e6f0ff);
    background-size: 400% 400%; animation: flow 15s ease infinite;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  @keyframes flow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card {
    width: 100%; max-width: 480px; margin: auto 0; padding: 40px 28px; text-align: center;
    overflow-wrap: anywhere;
    background: var(--card); border-radius: 16px; box-shadow: 0 2px 12px rgba(37,99,235,.08);
  }
  .avatar {
    width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 50%;
    display: grid; place-items: center; font-size: 44px; background: var(--tag);
  }
  h1 { margin: 0 0 8px; font-size: 24px; }
  p { margin: 0 0 20px; color: var(--muted); line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .tags span { padding: 4px 12px; border-radius: 999px; background: var(--tag); color: var(--accent); font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--tag); }
  h2 { margin: 0 0 16px; font-size: 18px; }
  .hobbies { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
  .hobbies li { padding: 12px; border-radius: 12px; background: var(--tag); }
  .contacts { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .contacts a, .contacts span {
    display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
    padding: 8px 12px; border-radius: 12px; background: var(--tag);
  }
  .contacts span { color: var(--muted); }
  footer { margin: 16px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  @media (max-width: 480px) {
    body { padding: 12px; }
    .card { padding: 28px 20px; }
    h1 { font-size: 22px; }
    .hobbies { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar">😀</div>
    <h1>小蓝</h1>
    <p>你好！我是小蓝，一个正在学写网页的编程新手，喜欢把想法一点点变成能看见的东西。</p>
    <div class="tags">
      <span>编程新手</span>
      <span>网页设计</span>
      <span>爱读书</span>
    </div>

    <section>
      <h2>我的兴趣爱好</h2>
      <ul class="hobbies">
        <li>📚 阅读</li>
        <li>🎧 音乐</li>
        <li>🏃 运动</li>
        <li>🎮 游戏</li>
      </ul>
    </section>

    <section>
      <h2>联系方式</h2>
      <ul class="contacts">
        <li><a href="mailto:hello@example.com">✉️ hello@example.com</a></li>
        <li><span>💬 微信：xiaolan-demo</span></li>
        <li><span>🐙 GitHub：xiaolan-demo</span></li>
      </ul>
    </section>
  </main>
  <footer>© 2026 小蓝 · 用 ❤ 做的第一个网页</footer>
</body>
</html>
